androidx-test = { module = "androidx.test.ext:junit", version.ref = "androidxTest" }
test-runner = { module = "androidx.test:runner", version.ref = "runner" }

appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
