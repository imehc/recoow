material3 = "1.5.0-beta02"
activity = "1.12.4"
lifecycle = "2.10.0"
navigation = "2.9.7"
datastore = "1.2.0"
coroutines = "1.10.2"
junit = "4.13.2"
turbine = "1.2.1"
androidxTest = "1.3.0"
runner = "1.7.0"
appcompat = "1.7.1"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
buildTools = "37.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
