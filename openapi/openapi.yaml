            type: string
          description: 记录ID
  /api/statistics/bills:
    get:
      operationId: getBillStatistics
      summary: 按账号和时区统计年度账单，包含月度收支、上年度对比和分类支出
      tags:
        - Management
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1971
            maximum: 9998
        - name: timezone
          in: query
          required: true
          schema:
            type: string
          description: IANA 时区，例如 Asia/Shanghai
      responses:
        '200':
          description: 按发生时间统计，排除退款和墓碑，金额使用整数分
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillStatistics'
        '400':
          description: 年份或时区无效
        '401':
          description: 凭据无效
