openapi: 3.0.3
info:
  title: Recoow API
  version: 1.0.0
  description: iOS、Android、Web 的唯一接口契约。设备配对和恢复保持兼容；未知快照字段须保留。接口契约版本与应用发布版本独立。
servers:
  - url: /
paths:
  /api/version:
    get:
      operationId: getBackendVersion
      summary: 查询运行中的后端版本
      tags:
        - Management
      security: []
      responses:
        '200':
          description: 当前后端的发布版本与构建提交
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendVersion'
  /api/change-events:
    get:
      operationId: listChangeEvents
      summary: 查看已提交到云端的业务变更
      tags:
        - History
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: 账号、数据集世代、查询版本与筛选条件绑定的分页游标，后续页保留原筛选条件。
        - name: generation
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: table
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
            maxLength: 200
          description: 记录 ID，必须与 table 一起提供。
        - name: operation
          in: query
          schema:
            $ref: '#/components/schemas/HistoryOperation'
        - name: client
          in: query
          schema:
            $ref: '#/components/schemas/ClientType'
          description: 原始修改平台，不是本次提交平台。
        - name: deviceId
          in: query
          schema:
            type: string
            maxLength: 200
          description: 本次鉴权提交设备的服务端 ID。
        - name: fromMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
          description: 服务端接受时间的包含下界；缺少该时间的旧历史不匹配时间筛选。
        - name: toMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
          description: 服务端接受时间的不包含上界。
      responses:
        '200':
          description: 按云端修订顺序倒序分页，列表只包含事件摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEventPage'
        '400':
          description: 无效筛选或游标
        '401':
          description: 凭据无效
        '409':
          description: reset_required，数据集世代已变化，需要重新查询。
  /api/change-events/{eventId}:
    get:
      operationId: getChangeEvent
      summary: 查看一次云端变更的来源、时间与字段差异
      tags:
        - History
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 对比提交前的云端版本与最终提交版本，不使用当前记录替代历史快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEventDetail'
        '401':
          description: 凭据无效
        '404':
          description: 事件不存在或不属于当前账号
  /api/devices/current/profile:
    put:
      operationId: updateCurrentDeviceProfile
      summary: 登记当前鉴权设备的来源资料
      description: 仅更新当前设备元数据，不授予写权限；客户端先检查 device_profiles_v1 能力。
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceProfileRequest'
      responses:
        '200':
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: 无效资料
        '401':
          description: 未鉴权
