openapi: 3.0.3
info:
  title: Recoow API
  version: 1.0.0
  description: 三端共用接口。JSON 字段及参数采用 snake_case；未知快照字段保留原样。
servers:
  - url: /
paths:
  /api/version:
    get:
      operationId: getBackendVersion
      summary: 查询运行中的后端版本
      tags:
        - Management
      security: []
      responses:
        '200':
          description: 当前后端的发布版本与构建提交
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendVersion'
  /api/change-events:
    get:
      operationId: listChangeEvents
      summary: 查看已提交到云端的业务变更
      tags:
        - History
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: 分页或增量游标
        - name: generation
          in: query
          schema:
            type: string
          description: 数据集世代
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: 单页数量上限
        - name: table
          in: query
          schema:
            type: string
          description: 实体类型
        - name: id
          in: query
          schema:
            type: string
            maxLength: 200
          description: 记录ID
        - name: operation
          in: query
          schema:
            $ref: '#/components/schemas/HistoryOperation'
          description: 变更操作
        - name: client
          in: query
          schema:
            $ref: '#/components/schemas/ClientType'
          description: 客户端平台
        - name: device_id
          in: query
          schema:
            type: string
            maxLength: 200
          description: 设备ID
          x-recoow-legacy-name: deviceId
        - name: from_ms
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
          description: 起始时间（毫秒时间戳，含）
          x-recoow-legacy-name: fromMs
        - name: to_ms
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
          description: 结束时间（毫秒时间戳，不含）
          x-recoow-legacy-name: toMs
      responses:
        '200':
          description: 按云端修订顺序倒序分页，列表只包含事件摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEventPage'
        '400':
          description: 无效筛选或游标
        '401':
          description: 凭据无效
        '409':
          description: reset_required，数据集世代已变化，需要重新查询。
  /api/change-events/{event_id}:
    get:
      operationId: getChangeEvent
      summary: 查看一次云端变更的来源、时间与字段差异
      tags:
        - History
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          x-recoow-legacy-name: eventId
          description: 变更事件ID
      responses:
        '200':
          description: 对比提交前的云端版本与最终提交版本，不使用当前记录替代历史快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEventDetail'
        '401':
          description: 凭据无效
        '404':
          description: 事件不存在或不属于当前账号
  /api/devices/current/profile:
    put:
      operationId: updateCurrentDeviceProfile
      summary: 登记当前鉴权设备的来源资料
      description: 仅更新当前设备元数据，不授予写权限；客户端先检查 device_profiles_v1 能力。
      security:
        - deviceToken: []
        - sessionToken: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceProfileRequest'
      responses:
        '200':
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        '400':
          description: 无效资料
        '401':
          description: 未鉴权
