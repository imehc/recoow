name: Android

on:
  pull_request:
    paths: ["android/**", "backend/**", "ios/recoow/**", "ios/Version.xcconfig", "ios/recoow.xcodeproj/project.pbxproj", "versions.json", "scripts/*.py", ".github/workflows/android.yml"]
  push:
    branches: ["**"]
    paths: ["android/**", "backend/**", "ios/recoow/**", "ios/Version.xcconfig", "ios/recoow.xcodeproj/project.pbxproj", "versions.json", "scripts/*.py", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check independent application versions
        run: |
          python3 scripts/version.py check
          python3 -m unittest discover -s scripts -p 'test_version.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :core:domain:test :core:database:testDebugUnitTest :core:data:testDebugUnitTest :core:network:testDebugUnitTest :core:update:testDebugUnitTest :feature:settings:testDebugUnitTest :feature:history:testDebugUnitTest :feature:statistics:testDebugUnitTest lint --stacktrace
      - name: Build performance variants
        working-directory: android
        run: ./gradlew :app:assembleBaseline :app:assembleBenchmark :benchmark:assembleBaseline :benchmark:assembleBenchmark --stacktrace
      - name: Check packaged release artifact
        working-directory: android
        run: |
          python3 -m unittest discover -s build-tools -p 'test_*.py'
          ./gradlew :app:verifyReleaseArtifact --stacktrace
      - name: Check committed Room schema history
        working-directory: android
        run: ./gradlew :core:database:checkSchemaHistory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-jdk-17
          path: |
            android/**/build/reports/
            android/**/build/test-results/

  device:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Assemble device test APKs before booting the emulator
        working-directory: android
        run: >-
          ./gradlew --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
          :core:database:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest
          :core:sync:assembleDebugAndroidTest :core:media:assembleDebugAndroidTest
          :core:backup:assembleDebugAndroidTest :core:calendar:assembleDebugAndroidTest
          :core:notifications:assembleDebugAndroidTest :core:location:assembleDebugAndroidTest
          :core:scene:assembleDebugAndroidTest :core:update:assembleDebugAndroidTest --stacktrace
      - name: Start isolated integration backend
        run: |
          python3 scripts/generate_sync_schema.py --output "$RUNNER_TEMP/recoow-schema"
          (cd backend && go build -o "$RUNNER_TEMP/recoow-api" ./cmd/api)
          RECOOW_SCHEMA="$RUNNER_TEMP/recoow-schema" RECOOW_DATA="$RUNNER_TEMP/recoow-data" RECOOW_LISTEN=127.0.0.1:8080 "$RUNNER_TEMP/recoow-api" > "$RUNNER_TEMP/recoow-api.log" 2>&1 &
          for attempt in {1..30}; do
            # Schema requires authentication; an anonymous 401 confirms the API is listening.
            if [ "$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/schema)" = 401 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run storage, sync, platform and Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            adb logcat -v threadtime > "$RUNNER_TEMP/emulator-logcat.txt" 2>&1 &
            ./gradlew --no-parallel --max-workers=2 :core:database:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest :core:sync:connectedDebugAndroidTest :core:media:connectedDebugAndroidTest :core:backup:connectedDebugAndroidTest :core:calendar:connectedDebugAndroidTest :core:notifications:connectedDebugAndroidTest :core:location:connectedDebugAndroidTest :core:scene:connectedDebugAndroidTest :core:update:connectedDebugAndroidTest :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.syncBaseUrl=http://10.0.2.2:8080/ --stacktrace
      - name: Collect host diagnostics after a device failure
        if: failure()
        run: sudo dmesg --ctime | tail -100 > "$RUNNER_TEMP/emulator-host-kernel.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-api-${{ matrix.api }}
          path: |
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator-logcat.txt
            ${{ runner.temp }}/emulator-host-kernel.log
            ${{ runner.temp }}/recoow-api.log
