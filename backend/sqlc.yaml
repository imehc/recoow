version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/queries
    gen:
      go:
        package: sqlgen
        out: internal/repository/sqlgen
        # pgx 的 stdlib 适配器与动态同步 SQL 共用同一个连接池和事务。
        sql_package: database/sql
        emit_empty_slices: true
        overrides:
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
